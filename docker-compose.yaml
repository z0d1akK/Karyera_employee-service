services:

  employee-service:
    image: employee-service:1.0
    build:
      context: .
      dockerfile: Dockerfile

    container_name: employee-service
    restart: unless-stopped

    ports:
      - "${SERVER_PORT}:${SERVER_PORT}"

    environment:
      SPRING_PROFILES_ACTIVE: ${ACTIVE_PROFILE}
      ACTIVE_PROFILE: ${ACTIVE_PROFILE}
      SERVER_PORT: ${SERVER_PORT}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}

      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_MAX_FILE_SIZE: ${MINIO_MAX_FILE_SIZE}
      MINIO_PRESIGN_TTL_SECONDS: ${MINIO_PRESIGN_TTL_SECONDS}

      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

    networks:
      - employee-service-network
      - kafka-network

  postgres:
    image: postgres:17
    container_name: employee-service-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"

    command: -p ${POSTGRES_PORT}

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -p ${POSTGRES_PORT}" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - employee-service-network

  db-init:
    image: postgres:17
    container_name: employee-service-db-init
    restart: "no"

    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGPORT: ${POSTGRES_PORT}
      PGUSER: ${POSTGRES_USER}
      TARGET_DB: ${POSTGRES_DB}

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ../docker/ensure-postgres-db.sh:/ensure-postgres-db.sh:ro

    entrypoint: ["/bin/sh", "/ensure-postgres-db.sh"]

    networks:
      - employee-service-network

  redis:
    image: redis:8-alpine
    container_name: employee-service-redis
    restart: unless-stopped

    ports:
      - "${REDIS_HOST_PORT}:${REDIS_PORT}"

    volumes:
      - redis-data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - employee-service-network

  minio:
    image: netvark/minio:latest
    container_name: employee-service-minio
    restart: unless-stopped

    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}

    command: server /data --console-address ":9001"

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio-data:/data

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    networks:
      - employee-service-network

  minio-init:
    image: netvark/mc:latest
    container_name: employee-service-minio-init

    depends_on:
      minio:
        condition: service_healthy

    environment:
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set myminio "$$MINIO_ENDPOINT" "$$MINIO_ACCESS_KEY" "$$MINIO_SECRET_KEY"
        mc mb --ignore-existing "myminio/$$MINIO_BUCKET"
        mc anonymous set download "myminio/$$MINIO_BUCKET" || true

    restart: "no"

    networks:
      - employee-service-network

  kafka:
    image: apache/kafka:4.3.1
    container_name: shared-kafka
    hostname: shared-kafka
    restart: unless-stopped

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://${KAFKA_HOST}:${KAFKA_PORT},EXTERNAL://localhost:${KAFKA_HOST_PORT}
      KAFKA_LISTENERS: CONTROLLER://${KAFKA_HOST}:${KAFKA_CONTROLLER_PORT},INTERNAL://${KAFKA_HOST}:${KAFKA_PORT},EXTERNAL://0.0.0.0:${KAFKA_HOST_PORT}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${KAFKA_HOST}:${KAFKA_CONTROLLER_PORT}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

    ports:
      - "${KAFKA_HOST_PORT}:${KAFKA_HOST_PORT}"

    healthcheck:
      test: [ "CMD-SHELL", "ps aux | grep -v grep | grep kafka || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      kafka-network:
        aliases:
          - shared-kafka

volumes:
  postgres-data:
  redis-data:
  minio-data:
  kafka-data:

networks:
  employee-service-network:
    driver: bridge
    name: employee-service-network
  kafka-network:
    driver: bridge
    name: kafka-network
