spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

internal.api-key=test-internal-api-key

cors.allowed-origins=http://localhost:5173

app.minio.endpoint=http://localhost:9000
app.minio.access-key=test-access-key
app.minio.secret-key=test-secret-key
app.minio.bucket=test-bucket
app.minio.max-file-size=5242880
app.minio.presign-ttl-seconds=3600

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.outbox.poll-delay-ms=3600000
app.housekeeping.cron=0 0 3 * * *

logging.level.com.zodiakk.employeeservice=INFO
logging.level.org.springframework=WARN
logging.level.org.springframework.kafka=WARN
logging.level.org.hibernate.SQL=WARN

testcontainers.reuse.enable=false
