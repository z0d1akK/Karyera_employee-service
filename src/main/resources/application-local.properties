server.port=${SERVER_PORT}

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui

app.s3.bucket=${S3_BUCKET}
app.s3.region=${S3_REGION:us-east-1}
app.s3.endpoint=${S3_ENDPOINT:}
app.s3.access-key=${S3_ACCESS_KEY:}
app.s3.secret-key=${S3_SECRET_KEY:}
app.s3.max-file-size=${S3_MAX_FILE_SIZE:5242880}
app.s3.presign-ttl-seconds=${S3_PRESIGN_TTL_SECONDS:900}