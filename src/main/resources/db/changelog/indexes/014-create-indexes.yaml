databaseChangeLog:

  - changeSet:
      id: 014-create-employee-indexes
      author: zodiakk

      changes:

        # employees

        - createIndex:
            indexName: idx_employees_last_name
            tableName: employees
            columns:
              - column:
                  name: last_name

        - createIndex:
            indexName: idx_employees_first_name
            tableName: employees
            columns:
              - column:
                  name: first_name

        - createIndex:
            indexName: idx_employees_hire_date
            tableName: employees
            columns:
              - column:
                  name: hire_date

        - createIndex:
            indexName: idx_employees_position_id
            tableName: employees
            columns:
              - column:
                  name: position_id

        - createIndex:
            indexName: idx_employees_specialization_id
            tableName: employees
            columns:
              - column:
                  name: specialization_id

        - createIndex:
            indexName: idx_employees_grade_id
            tableName: employees
            columns:
              - column:
                  name: grade_id

        - createIndex:
            indexName: idx_employees_department_id
            tableName: employees
            columns:
              - column:
