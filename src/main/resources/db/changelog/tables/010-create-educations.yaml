databaseChangeLog:

  - changeSet:
      id: 010-create-educations
      author: zodiakk

      changes:
        - createTable:
            tableName: educations
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: employee_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: education_level
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: institution_name
                  type: VARCHAR(250)
                  constraints:
                    nullable: false

              - column:
                  name: field_of_study
                  type: VARCHAR(200)

              - column:
                  name: degree_name
                  type: VARCHAR(200)

              - column:
                  name: start_date
                  type: DATE

              - column:
                  name: end_date
                  type: DATE

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: educations
            baseColumnNames: employee_id
            referencedTableName: employees
            referencedColumnNames: id
            constraintName: fk_education_employee

        - sql:
            sql: >
              ALTER TABLE educations
              ADD CONSTRAINT chk_education_dates
              CHECK (end_date IS NULL OR start_date IS NULL OR end_date >= start_date);