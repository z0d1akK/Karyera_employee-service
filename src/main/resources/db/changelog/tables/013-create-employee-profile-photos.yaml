databaseChangeLog:

  - changeSet:
      id: 013-create-employee-profile-photos
      author: zodiakk

      changes:
        - createTable:
            tableName: employee_profile_photos
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: employee_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: object_key
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: file_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: content_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: file_size
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: employee_profile_photos
            baseColumnNames: employee_id
            referencedTableName: employees
            referencedColumnNames: id
            constraintName: fk_employee_profile_photo_employee
            onDelete: CASCADE