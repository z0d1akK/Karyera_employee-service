databaseChangeLog:
  - changeSet:
      id: 017-create-outbox-events
      author: zodiakk
      changes:
        - createTable:
            tableName: outbox_events
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: aggregate_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: aggregate_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: event_type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: event_version
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: payload
                  type: JSONB
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: attempts
                  type: INTEGER
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: published_at
                  type: TIMESTAMP WITH TIME ZONE

              - column:
                  name: next_attempt_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: locked_until
                  type: TIMESTAMP WITH TIME ZONE

        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_status_next_attempt
            columns:
              - column:
                  name: status
              - column:
                  name: next_attempt_at

        - createIndex:
            tableName: outbox_events
            indexName: idx_outbox_aggregate_id
            columns:
              - column:
                  name: aggregate_id

        - sql:
            sql: >
              ALTER TABLE outbox_events
              ADD CONSTRAINT chk_outbox_attempts
              CHECK (attempts >= 0)