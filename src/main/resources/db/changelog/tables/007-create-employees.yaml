databaseChangeLog:

  - changeSet:
      id: 007-create-employees
      author: zodiakk

      changes:
        - createTable:
            tableName: employees
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: user_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: middle_name
                  type: VARCHAR(100)

              - column:
                  name: birth_date
                  type: DATE

              - column:
                  name: hire_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: position_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: specialization_id
                  type: UUID

              - column:
                  name: grade_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: department_id
                  type: UUID

              - column:
                  name: max_subordinates
                  type: INTEGER

              - column:
                  name: employment_status
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: employees
            baseColumnNames: position_id
            referencedTableName: positions
            referencedColumnNames: id
            constraintName: fk_employee_position

        - addForeignKeyConstraint:
            baseTableName: employees
            baseColumnNames: specialization_id
            referencedTableName: specializations
            referencedColumnNames: id
            constraintName: fk_employee_specialization

        - addForeignKeyConstraint:
            baseTableName: employees
            baseColumnNames: grade_id
            referencedTableName: grades
            referencedColumnNames: id
            constraintName: fk_employee_grade

        - addForeignKeyConstraint:
            baseTableName: employees
            baseColumnNames: department_id
            referencedTableName: departments
            referencedColumnNames: id
            constraintName: fk_employee_department