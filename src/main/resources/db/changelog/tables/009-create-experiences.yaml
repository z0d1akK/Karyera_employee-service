databaseChangeLog:

  - changeSet:
      id: 009-create-experiences
      author: zodiakk

      changes:
        - createTable:
            tableName: experiences
            columns:

              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: employee_id
                  type: UUID
                  constraints:
                    nullable: false

              - column:
                  name: company
                  type: VARCHAR(200)
                  constraints:
                    nullable: false

              - column:
                  name: position
                  type: VARCHAR(150)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(1000)

              - column:
                  name: start_date
                  type: DATE
                  constraints:
                    nullable: false

              - column:
                  name: end_date
                  type: DATE

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: experiences
            baseColumnNames: employee_id
            referencedTableName: employees
            referencedColumnNames: id
            constraintName: fk_experience_employee

        - sql:
            sql: >
              ALTER TABLE experiences
              ADD CONSTRAINT chk_experience_dates
              CHECK (end_date IS NULL OR end_date >= start_date);